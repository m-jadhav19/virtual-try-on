<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop try-on camera</title>
<script src="./vendor/react.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div id="shop" style="display:flex;flex-wrap:wrap;gap:20px;width:100%%;box-sizing:border-box;padding:20px;background:#0d0e10;font-family:'Space Grotesk',system-ui,sans-serif"><div style="flex:999 1 560px;min-width:0;height:860px;position:relative;overflow:hidden;border:2px solid #F4EFE3;border-radius:16px;background:radial-gradient(ellipse at 50% 38%,#4a5058 0%,#1c1f23 60%,#0d0e10 100%)"><div style="position:absolute;inset:0;bottom:124px;display:flex;align-items:center;justify-content:center"><div style="width:280px;height:280px;border:2px dashed rgba(255,255,255,.35);border-radius:50%;display:flex;align-items:center;justify-content:center"><div style="width:44px;height:{{fitPx}}px;border-radius:14px;background:{{strapColor}};border:2px solid #F4EFE3"></div></div></div><div style="position:absolute;top:20px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between"><a href="#shop" style="height:48px;padding:0 16px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;gap:8px;font:700 13px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.06em;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg> BACK TO SHOP</a><div style="height:36px;padding:0 14px;border:2px solid #111111;border-radius:6px;background:{{accent}};color:#111111;display:flex;align-items:center;font:700 12px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.08em">HAND DETECTED</div><button aria-label="Favorite" onClick="{{fav}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:{{favBg}};color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 20l-7-7a4.2 4.2 0 0 1 7-4.5A4.2 4.2 0 0 1 19 13z"></path></svg></button></div><sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:84px;left:0;right:0;display:flex;justify-content:center"><div style="height:36px;padding:0 14px;border:2px solid #111111;border-radius:6px;background:#F4EFE3;color:#111111;display:flex;align-items:center;font:700 12px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.08em">SAVED TO GALLERY</div></div></sc-if><div style="position:absolute;left:20px;top:340px;display:flex;flex-direction:column;align-items:center;gap:10px"><button aria-label="Previous item" onClick="{{prev}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><button aria-label="Next item" onClick="{{next}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:13px;font-weight:700;color:#111111;background:#F4EFE3;padding:4px 7px;border:2px solid #111111;border-radius:4px">{{count}}</span></div><div style="position:absolute;right:0;top:220px;width:84px;background:#F4EFE3;border:2px solid #111111;border-right:0;border-radius:16px 0 0 16px;box-shadow:-4px 4px 0 {{accent}};overflow:hidden"><button aria-label="Earrings" onClick="{{pick0}}" style="width:100%;height:78px;border:0;border-top:0;background:{{bg0}};color:#111111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="16" r="4"></circle><path d="M12 3v9"></path></svg><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em">EARR</span></button><button aria-label="Necklace" onClick="{{pick1}}" style="width:100%;height:78px;border:0;border-top:2px solid #111111;background:{{bg1}};color:#111111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 5c0 8 3 13 8 13s8-5 8-13"></path></svg><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em">NECK</span></button><button aria-label="Ring" onClick="{{pick2}}" style="width:100%;height:78px;border:0;border-top:2px solid #111111;background:{{bg2}};color:#111111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="15" r="5"></circle><path d="M9 7.5l3-4 3 4-3 1.5z"></path></svg><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em">RING</span></button><button aria-label="Watch" onClick="{{pick3}}" style="width:100%;height:78px;border:0;border-top:2px solid #111111;background:{{bg3}};color:#111111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M9.5 7.5l.5-4h4l.5 4M9.5 16.5l.5 4h4l.5-4"></path></svg><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em">WATCH</span></button><button aria-label="Hat" onClick="{{pick4}}" style="width:100%;height:78px;border:0;border-top:2px solid #111111;background:{{bg4}};color:#111111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 17h18M5 17c0-5 3-9 7-9s7 4 7 9"></path></svg><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em">HAT</span></button></div><div style="position:absolute;left:0;right:0;bottom:0;height:124px;background:#111111;border-top:2px solid #F4EFE3;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box"><div><div style="font:800 24px/1 'Space Grotesk',system-ui,sans-serif;color:#F4EFE3">{{name}}</div><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:13px;font-weight:700;background:#F4EFE3;color:#111111;padding:5px 9px;border-radius:4px;display:inline-block;margin-top:10px">[PRICE]</div></div><div style="display:flex;align-items:center;gap:24px"><button aria-label="Reset" onClick="{{reset}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></button><button aria-label="Capture" onClick="{{shoot}}" style="width:84px;height:84px;border-radius:50%;border:2px solid #F4EFE3;background:transparent;padding:5px;display:flex;cursor:pointer"><span style="flex:1;border-radius:50%;background:{{accent}};border:3px solid #111111;display:block"></span></button><button aria-label="Flip camera" onClick="{{flip}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg></button></div><div style="width:220px"></div></div></div><div style="flex:1 1 340px;min-width:0;max-width:420px;height:860px;box-sizing:border-box;padding:28px;background:#F4EFE3;color:#111111;border:2px solid #111111;border-radius:16px;box-shadow:5px 5px 0 {{accent}};overflow:hidden"><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.08em">{{catLabel}} / {{count}}</div><div style="font:800 32px/1.1 'Space Grotesk',system-ui,sans-serif;margin-top:8px">{{name}}</div><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:14px;font-weight:700;background:#111111;color:#F4EFE3;padding:6px 10px;border-radius:4px;display:inline-block;margin-top:12px">[PRICE]</div><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;margin:22px 0 10px">STRAP</div><div style="display:flex;gap:12px"><button aria-label="Strap 1" onClick="{{strap0}}" style="width:48px;height:48px;border-radius:50%;background:{{sc0}};border:{{sb0}};padding:0;cursor:pointer"></button><button aria-label="Strap 2" onClick="{{strap1}}" style="width:48px;height:48px;border-radius:50%;background:{{sc1}};border:{{sb1}};padding:0;cursor:pointer"></button><button aria-label="Strap 3" onClick="{{strap2}}" style="width:48px;height:48px;border-radius:50%;background:{{sc2}};border:{{sb2}};padding:0;cursor:pointer"></button><button aria-label="Strap 4" onClick="{{strap3}}" style="width:48px;height:48px;border-radius:50%;background:{{sc3}};border:{{sb3}};padding:0;cursor:pointer"></button></div><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;margin:22px 0 10px">FIT</div><div style="display:flex;align-items:center;gap:14px"><button aria-label="Smaller" onClick="{{fitDown}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 12h12"></path></svg></button><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:20px;font-weight:700;width:48px;text-align:center">{{fitLabel}}</span><button aria-label="Larger" onClick="{{fitUp}}" style="width:48px;height:48px;border-radius:10px;border:2px solid #111111;background:#F4EFE3;color:#111111;box-shadow:3px 3px 0 {{accent}};display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></button></div><div style="font-family:'Space Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;margin:22px 0 10px">MORE IN {{catLabel}}</div><div style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{items}}" as="it" hint-placeholder-count="3"><button onClick="{{it.pick}}" style="height:56px;border:2px solid #111111;border-radius:10px;background:{{it.bg}};color:#111111;display:flex;align-items:center;gap:14px;padding:0 16px;font:700 15px/1 'Space Grotesk',system-ui,sans-serif;text-align:left;cursor:pointer"><span style="font-family:'Space Mono',ui-monospace,monospace;font-size:12px">{{it.idx}}</span>{{it.name}}</button></sc-for></div><button onClick="{{addTap}}" style="margin-top:28px;width:100%;height:56px;border-radius:10px;border:2px solid #111111;background:{{addBg}};color:#111111;display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.08em;box-shadow:4px 4px 0 #111111;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"></path></svg>{{addLabel}}</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC928"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 3, item: 0, fav: false, toast: false, strap: 0, fit: 1, added: false };
}
renderVals() {
const s = this.state;
const set = (o) => this.setState(o);
const acc = this.props.accent ?? '#FFC928';
const ITEMS = [['Hoop Studs','Pearl Drop'],['Gold Chain','Pendant'],['Signet','Band'],['Digital Casio','Bamboo Watch','Richard Mille RM011'],['Bucket Hat','Cap']];
const CATS = ['EARR','NECK','RING','WATCH','HAT'];
const STRAPS = ['#1f2937','#a16207','#9ca3af','#be123c'];
const SIZES = ['S','M','L'];
const list = ITEMS[s.cat];
const n = list.length;
const v = {
name: list[s.item].toUpperCase(),
count: String(s.item + 1).padStart(2, '0') + '/' + String(n).padStart(2, '0'),
catLabel: CATS[s.cat],
items: list.map((nm, i) => ({ name: nm.toUpperCase(), idx: '0' + (i + 1), bg: i === s.item ? acc : '#F4EFE3', pick: () => set({ item: i }) })),
prev: () => set({ item: (s.item + n - 1) % n }),
next: () => set({ item: (s.item + 1) % n }),
fav: () => set({ fav: !s.fav }),
favBg: s.fav ? acc : '#F4EFE3',
reset: () => set({ item: 0, strap: 0, fit: 1, added: false }),
flip: () => {},
shoot: () => { set({ toast: true }); setTimeout(() => this.setState({ toast: false }), 1400); },
toast: s.toast,
strapColor: STRAPS[s.strap],
fitLabel: SIZES[s.fit],
fitPx: 130 + s.fit * 24,
fitDown: () => set({ fit: Math.max(0, s.fit - 1) }),
fitUp: () => set({ fit: Math.min(2, s.fit + 1) }),
addTap: () => set({ added: !s.added }),
addBg: s.added ? '#F4EFE3' : acc,
addLabel: s.added ? 'ADDED - TAP TO UNDO' : 'ADD TO CART',
};
CATS.forEach((c, i) => {
v['pick' + i] = () => set({ cat: i, item: 0 });
v['bg' + i] = s.cat === i ? acc : 'transparent';
});
STRAPS.forEach((c, i) => {
v['strap' + i] = () => set({ strap: i });
v['sc' + i] = c;
v['sb' + i] = s.strap === i ? '4px solid #111111' : '2px solid #8a8a82';
});
return v;
}
}
</script>
</body>
</html>
